services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    # Afinado para un VPS de ~1GB de RAM total: sin esto, Postgres asume mucha
    # más memoria disponible de la que hay y compite con el resto de los
    # contenedores. max_connections=30 alcanza justo con el pool del backend
    # (pool_size=10 + max_overflow=20, un solo worker).
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=30
      -c effective_cache_size=192MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
    mem_limit: 300m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cafe_db_data:/var/lib/postgresql/data
    networks:
      - cafe_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    mem_limit: 250m
    env_file: .env.prod
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cafe_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 48m
    depends_on:
      - backend
    networks:
      - cafe_internal
      - cafe_proxy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - cafe_proxy

networks:
  cafe_internal:
    driver: bridge
  cafe_proxy:
    driver: bridge

volumes:
  cafe_db_data:
  caddy_data:
  caddy_config:
